# =========================
# Server
# =========================
quarkus.http.port=8082
quarkus.http.host=0.0.0.0
quarkus.http.root-path=/search-services

# =========================
# OIDC
# =========================
# Behåll denna för intern kommunikation i Docker/K8s
quarkus.oidc.auth-server-url=http://keycloak:8080/realms/journal

# ÄNDRA DENNA: Måste matcha URL:en som Keycloak har i molnet
quarkus.oidc.token.issuer=https://keycloakk.app.cloud.cbh.kth.se/realms/journal

quarkus.oidc.client-id=frontend
quarkus.oidc.application-type=service

# Behåll dessa (bra för stabilitet)
quarkus.oidc.discovery-enabled=true
quarkus.oidc.connection-retry-count=20
quarkus.oidc.connection-delay=5S
quarkus.oidc.jwks-path=/protocol/openid-connect/certs

# =========================
# SECURITY & HEALTH (HÄR LÄGGER VI TILL TILLÅTELSE)
# =========================
# NY RAD: Tillåt molnets hälso-check utan token
quarkus.http.auth.permission.health.paths=/healthz
quarkus.http.auth.permission.health.policy=permit

# ÄNDRA DENNA: Skydda endast sök-endpoints, annars blockeras /healthz
quarkus.http.auth.permission.authenticated.paths=/search/*
quarkus.http.auth.permission.authenticated.policy=authenticated

# Allow preflight
quarkus.http.auth.permission.cors.paths=/*
quarkus.http.auth.permission.cors.methods=OPTIONS
quarkus.http.auth.permission.cors.policy=permit

# =========================
# CORS
# =========================
quarkus.http.cors.enabled=true
# LÄGG TILL: Molnets URL i listan
quarkus.http.cors.origins=http://localhost:5173,https://*.app.cloud.cbh.kth.se
quarkus.http.cors.methods=GET,POST,PUT,DELETE,OPTIONS
quarkus.http.cors.headers=accept,authorization,content-type,x-requested-with
quarkus.http.cors.exposed-headers=Authorization
quarkus.http.cors.access-control-allow-credentials=true
quarkus.http.cors.access-control-max-age=24H

# =========================
# REST client
# =========================
quarkus.rest-client.journal-client.url=http://journal-service:8084