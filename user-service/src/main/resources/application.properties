server.port=8080

# MySQL i KTH Cloud
spring.datasource.url=jdbc:mysql://mysql-journal:3306/journaldb
spring.datasource.username=journal
spring.datasource.password=journal
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Keycloak (PUBLIC cloud URL)
spring.security.oauth2.resourceserver.jwt.issuer-uri=https://keycloakk.app.cloud.cbh.kth.se/realms/journal
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=https://keycloakk.app.cloud.cbh.kth.se/realms/journal/protocol/openid-connect/certs

# Actuator
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
