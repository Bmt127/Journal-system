server.port=8081

# Databasanslutning (matchar namnet 'journal-mysql' i din docker-compose)
spring.datasource.url=jdbc:mysql://journal-mysql:3306/journal_users
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Keycloak-konfiguration
# Issuer-uri används för att validera att token kommer från rätt ställe
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://keycloak:8080/realms/journal
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=http://keycloak:8080/realms/journal/protocol/openid-connect/certs
# Actuator för hälso-checks
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true