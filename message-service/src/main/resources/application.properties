server.port=${PORT:8080}

spring.datasource.url=jdbc:mysql://mysql-message:3306/messagedb
spring.datasource.username=journal
spring.datasource.password=journal

spring.jpa.hibernate.ddl-auto=update

spring.jpa.show-sql=true

spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:8180/realms/journal
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=http://keycloak:8080/realms/journal/protocol/openid-connect/certs


management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
