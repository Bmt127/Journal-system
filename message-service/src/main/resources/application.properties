# Server Port Configuration
server.port=${PORT:8080}

# MySQL Database Configuration
spring.datasource.url=jdbc:mysql://mysql-message:3306/messagedb
spring.datasource.username=journal
spring.datasource.password=journal

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# OAuth2 Resource Server (Keycloak JWT)
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:8180/realms/journal
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=http://keycloak:8080/realms/journal/protocol/openid-connect/certs

# Management Endpoints Configuration
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true

# Kafka Configuration
# Replace with your actual Kafka broker URL
spring.kafka.bootstrap-servers=localhost:9092

# Configure the consumer group ID for your service
spring.kafka.consumer.group-id=message-service-group

# Serializer for the producer (if you're using JSON or Avro, you can adjust the serializer accordingly)
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer

# Deserializer for the consumer
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer

# Additional Kafka Configuration (Optional)
# Enable idempotence for Kafka producer (helps in avoiding duplicates)
spring.kafka.producer.enable-idempotence=true

# Kafka Listener Configuration (Optional)
# Enable synchronous commit (if required)
spring.kafka.listener.ack-mode=manual
spring.kafka.listener.concurrency=3

# Kafka Topic Configuration (Add your topic name here)
spring.kafka.topic.message=test-topic
