server.port=${PORT:8080}

spring.datasource.url=jdbc:mysql://mysql-message:3306/messagedb
spring.datasource.username=message
spring.datasource.password=message

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

spring.security.oauth2.resourceserver.jwt.issuer-uri=http://keycloak:8080/realms/journal

management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
